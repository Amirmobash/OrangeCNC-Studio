[workspace]
members = [
  "apps/desktop",
  "crates/domain",
  "crates/gcode",
  "crates/motion",
  "crates/machine",
  "crates/simulation",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Amir Mobasheraghdam"]
license = "MIT"
repository = "https://github.com/REPLACE_WITH_YOUR_GITHUB/Amir-Mobasheraghdam-OrangeCNC-Studio"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.29"
egui = "0.29"
rfd = "0.15"
