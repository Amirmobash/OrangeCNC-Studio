[workspace]
members = [
  "apps/desktop",
  "crates/domain",
  "crates/gcode",
  "crates/motion",
  "crates/machine",
  "crates/simulation",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["Amir Mobasheraghdam"]
license = "MIT"
repository = "https://github.com/Amirmobash/OrangeCNC-Studio"
rust-version = "1.78"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
eframe = "0.29"
egui = "0.29"
rfd = "0.15"
